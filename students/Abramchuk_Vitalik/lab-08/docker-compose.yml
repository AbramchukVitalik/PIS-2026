version: "3.9"

services:
  request-service:
    build: ./services/request_service
    ports:
      - "8000:8000"

  group-service:
    build: ./services/group_service
    ports:
      - "8001:8001"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  api-gateway:
    image: nginx
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
